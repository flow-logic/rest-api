<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Estudiantes Protegida</title>
    <style>
        /* Estilos básicos para centrar y dar diseño al modal */
        dialog {
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 300px;
        }
        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5); /* Fondo oscuro semitransparente */
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .modal-buttons {
            text-align: right;
        }
        .modal-buttons button {
            padding: 8px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .modal-buttons button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Estudiantes</h1>
    <ul id="lista-estudiantes"></ul>

    <!-- Modal nativo de HTML5 -->
    <dialog id="login-dialog">
        <form id="login-form" method="dialog">
            <h3>Iniciar Sesión</h3>
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <div class="modal-buttons">
                <button type="submit" id="btn-entrar">Entrar</button>
            </div>
        </form>
    </dialog>

    <script>
        // Función para mostrar el modal y esperar a que el usuario pulse "Entrar"
        function pedirCredenciales() {
            return new Promise((resolve) => {
                const dialog = document.getElementById('login-dialog');
                const form = document.getElementById('login-form');
                const inputUsuario = document.getElementById('usuario');
                const inputPassword = document.getElementById('password');

                // Mostramos el diálogo de forma modal (bloquea la página de fondo)
                dialog.showModal();

                // Escuchamos cuando se envía el formulario del dialog
                form.onsubmit = (e) => {
                    e.preventDefault(); // Evitamos que recargue la página
                    const usuario = inputUsuario.value;
                    const password = inputPassword.value;
                    
                    dialog.close(); // Cerramos el modal
                    resolve({ usuario, password });
                };
            });
        }

        async function cargarEstudiantes() {
            // Llamamos a la función que abre nuestro diálogo personalizado
            const { usuario, password } = await pedirCredenciales();

            try {
                // Codificamos las credenciales en Base64 para Basic Auth
                const credencialesBase64 = btoa(`${usuario}:${password}`);

                // Hacemos la petición incluyendo el encabezado de autorización
                const respuesta = await fetch('http://localhost:8080/api/students', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Basic ${credencialesBase64}`,
                        'Content-Type': 'application/json'
                    }
                });

                // Verificamos si la autenticación fue exitosa
                if (respuesta.status === 401) {
                    alert("Acceso denegado: Usuario o contraseña incorrectos.");
                    location.reload(); // Recargamos para volver a pedir credenciales
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error(`Error en el servidor: ${respuesta.status}`);
                }

                const estudiantes = await respuesta.json();
                console.log(estudiantes);
                
                // Seleccionamos el elemento <ul> del HTML
                const ul = document.getElementById('lista-estudiantes');
                
                // Recorremos cada estudiante y creamos un <li>
                estudiantes.forEach(estudiante => {
                    const li = document.createElement('li');
                    li.textContent = estudiante.firstName + " " + estudiante.lastName;
                    ul.appendChild(li);
                });

            } catch (error) {
                console.error('Error al conectar con la API:', error);
                alert("Ocurrió un error al intentar conectar con el servidor.");
            }
        }

        cargarEstudiantes();
    </script>

</body>
</html>
